<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Capital Cities Population Quiz</title>
  <meta name="description" content="Which capital city has a bigger population? Guess higher or lower and build a streak in this capital cities geography quiz.">
  <link rel="canonical" href="https://geo-games-project-1.vercel.app/games/capital-higher-lower/">

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://geo-games-project-1.vercel.app/games/capital-higher-lower/">
  <meta property="og:title" content="Capital Cities Population Quiz">
  <meta property="og:description" content="Which capital city has a bigger population? Guess higher or lower and build a streak in this capital cities geography quiz.">
  <meta property="og:image" content="https://geo-games-project-1.vercel.app/assets/images/og-capital-higher-lower.png">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Capital Cities Population Quiz">
  <meta name="twitter:description" content="Which capital city has a bigger population? Guess higher or lower and build a streak in this capital cities geography quiz.">
  <meta name="twitter:image" content="https://geo-games-project-1.vercel.app/assets/images/og-capital-higher-lower.png">

  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="style.css">

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "Capital Cities Population Quiz",
    "url": "https://geo-games-project-1.vercel.app/games/capital-higher-lower/",
    "description": "Which capital city has a bigger population? Guess higher or lower and build a streak.",
    "applicationCategory": "Game",
    "operatingSystem": "Any",
    "offers": {
      "@type": "Offer",
      "price": "0",
      "priceCurrency": "USD"
    }
  }
  </script>
</head>
<body>

  <header class="site-header">
    <a href="/" class="site-logo">
      <span class="logo-icon">🌍</span>
      <span class="logo-text">Geo<span>Games</span></span>
    </a>
    <nav>
      <ul class="site-nav">
        <li><a href="/">← All Games</a></li>
      </ul>
    </nav>
  </header>

  <div class="game-container">
    <h1 class="game-title">Capital Higher or Lower</h1>
    <p class="game-subtitle">Which capital city has a larger population?</p>

    <!-- Score bar -->
    <div class="score-bar">
      <div>
        <div class="label">Score</div>
        <div class="value streak" id="score">0</div>
      </div>
      <div>
        <div class="label">Best</div>
        <div class="value" id="best">0</div>
      </div>
    </div>

    <!-- Game area -->
    <div id="game-area">
      <!-- Known capital -->
      <div class="country-display" id="country-known">
        <div class="flag" id="flag-known"></div>
        <div class="country-name" id="capital-known"></div>
        <div class="stat-label">CAPITAL OF <span id="nation-known"></span></div>
        <div class="country-stat" id="pop-known"></div>
      </div>

      <!-- VS divider -->
      <div class="vs-divider">VS</div>

      <!-- Unknown capital -->
      <div class="country-display mystery" id="country-unknown">
        <div class="flag" id="flag-unknown"></div>
        <div class="country-name" id="capital-unknown"></div>
        <div class="stat-label">CAPITAL OF <span id="nation-unknown"></span></div>
        <div class="country-stat" id="pop-unknown">???</div>

        <div class="btn-row" id="btn-row">
          <button class="btn btn-higher" onclick="guess('higher')">↑ Higher</button>
          <button class="btn btn-lower" onclick="guess('lower')">↓ Lower</button>
        </div>
      </div>
    </div>

    <!-- Game over -->
    <div id="game-over" class="game-over" style="display:none;">
      <div class="final-label">FINAL SCORE</div>
      <div class="final-score" id="final-score">0</div>
      <div style="margin-top: var(--space-lg);">
        <button class="btn btn-primary" onclick="startGame()">Play Again</button>
        <button class="btn share-btn" onclick="shareScore()">Share Score</button>
      </div>
    </div>
  </div>

  <script src="/js/shared.js"></script>
  <script src="game.js"></script>
</body>
</html>
