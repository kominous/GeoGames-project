<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flag Quiz — Guess the Country by Its Flag</title>
  <meta name="description" content="Can you identify each country by its flag? 10 rounds of flag quiz challenges — type the country name and score points.">
  <link rel="canonical" href="https://meridly.net/games/flag-quiz/">

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://meridly.net/games/flag-quiz/">
  <meta property="og:title" content="Flag Quiz — Guess the Country by Its Flag">
  <meta property="og:description" content="Can you identify each country by its flag? 10 rounds of flag quiz challenges — type the country name and score points.">
  <meta property="og:image" content="https://meridly.net/assets/images/og-flag-quiz.png">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Flag Quiz — Guess the Country by Its Flag">
  <meta name="twitter:description" content="Can you identify each country by its flag? 10 rounds of flag quiz challenges — type the country name and score points.">
  <meta name="twitter:image" content="https://meridly.net/assets/images/og-flag-quiz.png">

  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="style.css">

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "Flag Quiz — Guess the Country by Its Flag",
    "url": "https://meridly.net/games/flag-quiz/",
    "description": "Identify each country by its flag in 10 rounds. A free online flag quiz game.",
    "applicationCategory": "Game",
    "operatingSystem": "Any",
    "offers": {
      "@type": "Offer",
      "price": "0",
      "priceCurrency": "USD"
    }
  }
  </script>
</head>
<body>

  <header class="site-header">
    <a href="/" class="site-logo">
      <span class="logo-icon">🌍</span>
      <span class="logo-text">Meridly</span>
    </a>
    <nav>
      <ul class="site-nav">
        <li><a href="/">← All Games</a></li>
      </ul>
    </nav>
  </header>

  <div class="game-container">
    <h1 class="game-title">Flag Quiz</h1>
    <p class="game-subtitle">Which country does this flag belong to?
      <br>Careful! You only get 1 guess per country so watch out for typos! (Common aliases accepted) </p>
    
    

    <!-- Score bar -->
    <div class="score-bar">
      <div>
        <div class="label">Score</div>
        <div class="value streak" id="score">0</div>
      </div>
      <div>
        <div class="label">Round</div>
        <div class="value" id="round">1 / 10</div>
      </div>
      <div>
        <div class="label">Best</div>
        <div class="value" id="best">0</div>
      </div>
    </div>

    <!-- Game area -->
    <div id="game-area">
      <div class="flag-display">
        <img id="flag-img" src="" alt="Country flag">
      </div>

      <div class="input-row">
        <input
          type="text"
          id="answer-input"
          class="answer-input"
          placeholder="Type country name…"
          autocomplete="off"
          autocorrect="off"
          spellcheck="false"
        >
        <button class="btn btn-primary" id="submit-btn" onclick="submitGuess()">Submit</button>
      </div>

      <div id="feedback" class="feedback"></div>
    </div>

    <!-- Game over -->
    <div id="game-over" class="game-over" style="display:none;">
      <div class="final-label">FINAL SCORE</div>
      <div class="final-score" id="final-score">0 / 10</div>
      <div style="margin-top: var(--space-lg);">
        <button class="btn btn-primary" onclick="startGame()">Play Again</button>
        <button class="btn share-btn" onclick="shareScore()">Share Score</button>
      </div>
    </div>
  </div>

  <script src="/js/shared.js"></script>
  <script src="game.js"></script>
</body>
</html>
