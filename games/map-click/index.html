<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Find the Capital — Map Location Quiz</title>
  <meta name="description" content="Click where you think a capital city is on the map. The closer your guess, the more points you earn. A precision geography quiz.">
  <link rel="canonical" href="https://BASE_URL/games/map-click/">

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://BASE_URL/games/map-click/">
  <meta property="og:title" content="Find the Capital — Map Location Quiz">
  <meta property="og:description" content="Click where you think a capital city is on the map. The closer your guess, the more points you earn. A precision geography quiz.">
  <meta property="og:image" content="https://BASE_URL/assets/images/og-map-click.png">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Find the Capital — Map Location Quiz">
  <meta name="twitter:description" content="Click where you think a capital city is on the map. The closer your guess, the more points you earn. A precision geography quiz.">
  <meta name="twitter:image" content="https://BASE_URL/assets/images/og-map-click.png">

  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="style.css">

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "Find the Capital — Map Location Quiz",
    "url": "https://BASE_URL/games/map-click/",
    "description": "Click where you think a capital city is on the map. The closer your guess, the more points you earn.",
    "applicationCategory": "Game",
    "operatingSystem": "Any",
    "offers": {
      "@type": "Offer",
      "price": "0",
      "priceCurrency": "USD"
    }
  }
  </script>
</head>
<body>

  <header class="site-header">
    <a href="/" class="site-logo">
      <span class="logo-icon">🌍</span>
      <span class="logo-text">Geo<span>Games</span></span>
    </a>
    <nav>
      <ul class="site-nav">
        <li><a href="/">← All Games</a></li>
      </ul>
    </nav>
  </header>

  <div class="map-game-wrapper">

    <div class="map-game-header">
      <h1 class="game-title">Map Click</h1>
      <p class="game-subtitle">Click where you think the capital city is. The closer you get, the more points you earn.</p>

      <!-- Score bar -->
      <div class="score-bar">
        <div>
          <div class="label">Round</div>
          <div class="value" id="round-num">1 / 10</div>
        </div>
        <div>
          <div class="label">Score</div>
          <div class="value streak" id="total-score">0</div>
        </div>
        <div>
          <div class="label">Best</div>
          <div class="value" id="best">0</div>
        </div>
      </div>
    </div>

    <!-- Game area -->
    <div id="game-area">

      <!-- Prompt card -->
      <div class="prompt-card" id="prompt-card">
        <div class="prompt-flag" id="prompt-flag"></div>
        <div class="prompt-text">
          <div class="prompt-label">Click on the capital of</div>
          <div class="prompt-country" id="prompt-country"></div>
          <div class="prompt-capital" id="prompt-capital"></div>
        </div>
      </div>

      <!-- Map -->
      <div id="map"></div>
      <div class="click-hint" id="click-hint">Click anywhere on the map above ↑</div>

      <!-- Round result (shown after each click) -->
      <div class="round-result" id="round-result" style="display:none;">
        <div class="result-row">
          <div class="result-item">
            <div class="result-label">Distance</div>
            <div class="result-value" id="result-distance">—</div>
          </div>
          <div class="result-item">
            <div class="result-label">Points</div>
            <div class="result-value" id="result-points">—</div>
          </div>
        </div>
        <button class="btn btn-primary" id="next-btn" onclick="nextRound()">Next Round →</button>
      </div>

    </div>

    <!-- Game over -->
    <div id="game-over" class="game-over" style="display:none;">
      <div class="final-label">FINAL SCORE</div>
      <div class="final-score" id="final-score">0</div>
      <div class="final-max">out of 10,000</div>
      <div style="margin-top: var(--space-lg);">
        <button class="btn btn-primary" onclick="startGame()">Play Again</button>
        <button class="btn share-btn" onclick="shareScore()">Share Score</button>
      </div>
    </div>

  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/js/shared.js"></script>
  <script src="game.js"></script>
</body>
</html>
