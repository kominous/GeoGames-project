<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Country Border Chain — Connect Countries Quiz</title>
  <meta name="description" content="Travel from one country to another by crossing shared borders. Find the shortest route in this geography pathfinding quiz.">
  <link rel="canonical" href="https://meridly.net/games/travel/">

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://meridly.net/games/travel/">
  <meta property="og:title" content="Country Border Chain — Connect Countries Quiz">
  <meta property="og:description" content="Travel from one country to another by crossing shared borders. Find the shortest route in this geography pathfinding quiz.">
  <meta property="og:image" content="https://meridly.net/assets/images/og-travel.png">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Country Border Chain — Connect Countries Quiz">
  <meta name="twitter:description" content="Travel from one country to another by crossing shared borders. Find the shortest route in this geography pathfinding quiz.">
  <meta name="twitter:image" content="https://meridly.net/assets/images/og-travel.png">

  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="style.css">

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "Country Border Chain — Connect Countries Quiz",
    "url": "https://meridly.net/games/travel/",
    "description": "Travel from one country to another by crossing shared borders. Find the shortest route.",
    "applicationCategory": "Game",
    "operatingSystem": "Any",
    "offers": {
      "@type": "Offer",
      "price": "0",
      "priceCurrency": "USD"
    }
  }
  </script>
</head>
<body>

  <header class="site-header">
    <a href="/" class="site-logo">
      <span class="logo-icon">🌍</span>
      <span class="logo-text">Meridly</span>
    </a>
    <nav>
      <ul class="site-nav">
        <li><a href="/">← All Games</a></li>
      </ul>
    </nav>
  </header>

  <div class="travel-wrapper">

    <div class="travel-header">
      <h1 class="game-title">Travel</h1>
      <p class="game-subtitle">Type a neighboring country to move there. Get from start to destination in as few steps as possible!</p>

      <!-- Score bar -->
      <div class="score-bar">
        <div>
          <div class="label">Your Steps</div>
          <div class="value" id="steps-taken">0</div>
        </div>
        <div>
          <div class="label">Optimal</div>
          <div class="value streak" id="optimal-steps">?</div>
        </div>
        <div>
          <div class="label">Best</div>
          <div class="value" id="best">—</div>
        </div>
      </div>

      <!-- Endpoints -->
      <div class="endpoints">
        <div class="endpoint start-endpoint">
          <div class="endpoint-label">FROM</div>
          <div class="endpoint-flag" id="start-flag"></div>
          <div class="endpoint-name" id="start-name"></div>
        </div>
        <div class="endpoint-arrow">→</div>
        <div class="endpoint dest-endpoint">
          <div class="endpoint-label">TO</div>
          <div class="endpoint-flag" id="dest-flag"></div>
          <div class="endpoint-name" id="dest-name"></div>
        </div>
      </div>

      <!-- Route bar -->
      <div id="route-bar" class="route-bar"></div>
    </div>

    <!-- Map -->
    <div id="map"></div>

    <!-- Legend -->
    <div class="map-legend">
      <span class="legend-item legend-current">■ You are here</span>
      <span class="legend-item legend-dest">■ Destination</span>
      <span class="legend-item legend-visited">■ Visited</span>
    </div>

    <!-- Type input -->
    <div class="input-area" id="input-area">
      <input
        type="text"
        id="answer-input"
        class="answer-input"
        placeholder="Type a neighboring country…"
        autocomplete="off"
        autocorrect="off"
        spellcheck="false"
      >
      <button class="btn btn-primary" id="submit-btn" onclick="submitGuess()">Go →</button>
    </div>
    <div id="map-feedback" class="map-feedback"></div>

    <!-- Game over -->
    <div id="game-over" class="game-over" style="display:none;">
      <div class="final-label" id="result-label">ARRIVED!</div>
      <div class="final-score" id="result-steps"></div>
      <div class="result-detail" id="result-detail"></div>
      <div class="final-route" id="final-route"></div>
      <div style="margin-top: var(--space-lg);">
        <button class="btn btn-primary" onclick="startGame()">Play Again</button>
        <button class="btn share-btn" onclick="shareScore()">Share</button>
      </div>
    </div>

  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/js/shared.js"></script>
  <script src="game.js"></script>
</body>
</html>
