<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Travel — find the shortest route between two countries by crossing neighbors.">
  <title>Travel — GeoGames</title>
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-header">
    <a href="/" class="site-logo">
      <span class="logo-icon">🌍</span>
      <span class="logo-text">Geo<span>Games</span></span>
    </a>
    <nav>
      <ul class="site-nav">
        <li><a href="/">← All Games</a></li>
      </ul>
    </nav>
  </header>

  <div class="travel-wrapper">

    <div class="travel-header">
      <h1 class="game-title">Travel</h1>
      <p class="game-subtitle">Click neighboring countries on the map to travel from start to destination. Find the shortest route!</p>

      <!-- Score bar -->
      <div class="score-bar">
        <div>
          <div class="label">Your Steps</div>
          <div class="value" id="steps-taken">0</div>
        </div>
        <div>
          <div class="label">Optimal</div>
          <div class="value streak" id="optimal-steps">?</div>
        </div>
        <div>
          <div class="label">Best</div>
          <div class="value" id="best">—</div>
        </div>
      </div>

      <!-- Endpoints -->
      <div class="endpoints">
        <div class="endpoint start-endpoint">
          <div class="endpoint-label">FROM</div>
          <div class="endpoint-flag" id="start-flag"></div>
          <div class="endpoint-name" id="start-name"></div>
        </div>
        <div class="endpoint-arrow">→</div>
        <div class="endpoint dest-endpoint">
          <div class="endpoint-label">TO</div>
          <div class="endpoint-flag" id="dest-flag"></div>
          <div class="endpoint-name" id="dest-name"></div>
        </div>
      </div>

      <!-- Route bar -->
      <div id="route-bar" class="route-bar"></div>
    </div>

    <!-- Map (always visible) -->
    <div id="map"></div>
    <div id="map-feedback" class="map-feedback"></div>

    <!-- Map legend -->
    <div class="map-legend">
      <span class="legend-item legend-current">■ You are here</span>
      <span class="legend-item legend-dest">■ Destination</span>
      <span class="legend-item legend-neighbor">■ Valid neighbor</span>
      <span class="legend-item legend-visited">■ Visited</span>
    </div>

    <!-- Game over (appears below map, map stays visible) -->
    <div id="game-over" class="game-over" style="display:none;">
      <div class="final-label" id="result-label">ARRIVED!</div>
      <div class="final-score" id="result-steps"></div>
      <div class="result-detail" id="result-detail"></div>
      <div class="final-route" id="final-route"></div>
      <div style="margin-top: var(--space-lg);">
        <button class="btn btn-primary" onclick="startGame()">Play Again</button>
        <button class="btn share-btn" onclick="shareScore()">Share</button>
      </div>
    </div>

  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/js/shared.js"></script>
  <script src="game.js"></script>
</body>
</html>
